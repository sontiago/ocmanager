name: admin

on:
  push:
    branches: [main]
    paths: ["frontend/admin/**", ".github/workflows/admin.yml"]
  pull_request:
    paths: ["frontend/admin/**", ".github/workflows/admin.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
