[project]
name = "ocmanager"
version = "0.1.0"
description = "SaaS-панель для ocserv: API, воркер и бот"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5,<6",
    "arq>=0.26",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "httpx>=0.28",
    "time-machine>=2.16",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT", "DTZ"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]  # assert в тестах; кириллица в тексте

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S105", "S106", "S108", "ASYNC240"]  # тестовые «пароли», /tmp, pathlib в async
"conftest.py" = ["S105", "S106"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["src"]
markers = [
    "db: нужен Postgres и Redis из deploy/docker-compose.dev.yml",
    "ocserv: нужен живой ocserv и vpn-client (tests/integration)",
]
addopts = "-m 'not ocserv' --strict-markers"
