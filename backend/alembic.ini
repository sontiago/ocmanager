# URL базы здесь не хранится: alembic/env.py берёт его из OCM_DATABASE_URL
# (через Settings) или из config.attributes["database_url"] в тестах.
[alembic]
script_location = %(here)s/alembic
file_template = %%(rev)s_%%(slug)s
path_separator = os
timezone = UTC

[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = exec
ruff_fix.executable = %(here)s/.venv/bin/ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = %(here)s/.venv/bin/ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
